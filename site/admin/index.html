<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel — DeuFome</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#0d0a08;
    --app-bg:#FFF6EA;
    --card:#ffffff;
    --card-2:#FBE7CE;
    --border:#F0DDC0;
    --orange:#E8720C;
    --orange-strong:#C85D08;
    --gold:#F0B23D;
    --gold-dark:#A9720A;
    --ink:#2A1A10;
    --ink-soft:#6B5645;
    --ink-faint:#9A8874;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 14px 34px -18px rgba(0,0,0,.65);
  }
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    background:var(--app-bg);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif}
  a{color:inherit}
  img{max-width:100%;display:block}
  button{font-family:inherit;border:none;cursor:pointer;background:none}
  input,textarea{font-family:inherit;font-size:inherit}

  .logo-badge{
    border-radius:50%;
    background:radial-gradient(circle at 50% 30%, #241b12, #120d09);
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;line-height:1;
  }

  /* ── Gate (login) ── */
  #gate{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;background:var(--dark);color:#fff;text-align:center;padding:24px;
  }
  #gate .logo-badge{width:64px;height:64px;font-size:28px;margin-bottom:4px}
  #gate h1{font-weight:800;font-size:26px}
  #gate p{color:rgba(245,236,224,.65);font-size:14.5px;max-width:320px;line-height:1.5}
  .btn-gold{
    background:var(--orange);color:#1a1006;font-weight:700;font-size:14.5px;
    padding:13px 26px;border-radius:999px;transition:background .15s;
  }
  .btn-gold:hover{background:var(--orange-strong)}

  /* ── App shell ── */
  #app{display:none;min-height:100vh;flex-direction:column}
  #app.show{display:flex}
  .topbar{
    background:var(--dark);color:#fff;display:flex;align-items:center;gap:12px;
    padding:14px 20px;position:sticky;top:0;z-index:40;box-shadow:var(--shadow);
    border-bottom:1px solid var(--border);
  }
  .topbar .logo-badge{width:38px;height:38px;font-size:18px}
  .topbar .brand{font-weight:800;font-size:17px;flex:1;min-width:0}
  .topbar .brand small{display:block;font-family:'Inter',sans-serif;font-style:normal;font-weight:400;
    font-size:11.5px;color:rgba(245,236,224,.6);letter-spacing:.03em}
  .topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .link-ghost{
    color:rgba(245,236,224,.85);font-size:13px;font-weight:600;padding:8px 12px;
    border-radius:999px;border:1px solid rgba(245,236,224,.2);transition:all .15s;white-space:nowrap;
  }
  .link-ghost:hover{background:rgba(245,236,224,.08)}

  main{flex:1;width:100%;max-width:1020px;margin:0 auto;padding:22px 20px 60px}

  /* ── Tabs ── */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .tab{
    padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;
    background:var(--card);color:var(--ink-soft);border:1px solid var(--border);transition:all .15s;
  }
  .tab.active{background:var(--orange);color:#1a1006;border-color:var(--orange)}
  .tab .count{opacity:.7;font-weight:600;margin-left:4px}

  /* ── Status bar ── */
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
  .status.dirty .dot{background:var(--gold-dark)}
  .status.saving .dot{background:var(--orange);animation:pulse 1s infinite}
  .status.error .dot{background:#e07a5f}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .statusbar-actions{display:flex;gap:10px}
  .btn-primary{
    background:var(--orange);color:#1a1006;font-weight:700;font-size:13.5px;
    padding:10px 20px;border-radius:999px;transition:opacity .15s;
  }
  .btn-primary:disabled{opacity:.35;cursor:default}
  .btn-primary:not(:disabled):hover{opacity:.88}
  .btn-text{color:var(--ink-soft);font-size:13px;font-weight:600;text-decoration:underline;padding:10px 4px}

  /* ── Grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;
  }
  .card.dragging{
    position:relative;z-index:50;box-shadow:0 20px 40px -14px rgba(0,0,0,.6);
    opacity:.92;user-select:none;-webkit-user-select:none;
  }
  .card-photo{
    aspect-ratio:4/3;background:var(--card-2);display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);overflow:hidden;
  }
  .card-photo img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:13px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card-body h3{font-size:15px;font-weight:700;line-height:1.25}
  .card-body p{font-size:12.5px;color:var(--ink-soft);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-price{font-family:'Poppins',sans-serif;font-weight:700;color:var(--gold-dark);font-size:13px;margin-top:auto;padding-top:4px;line-height:1.4}
  .card-actions{display:flex;gap:8px;padding:0 14px 14px}
  .icon-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border);
    font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:all .15s;
  }
  .icon-btn:hover{border-color:var(--orange);color:var(--orange)}
  .icon-btn.danger:hover{border-color:#e07a5f;color:#e07a5f}
  .drag-handle{
    flex:0 0 auto;padding:8px 10px;cursor:grab;touch-action:none;font-size:15px;letter-spacing:-1px;
  }
  .drag-handle:active{cursor:grabbing}

  /* ── Reordenar categorias ── */
  .reorder-hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;line-height:1.4}
  .reorder-list{display:flex;flex-direction:column;gap:8px}
  .reorder-row{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:8px 10px;
  }
  .reorder-row.dragging{
    position:relative;z-index:50;box-shadow:0 20px 40px -14px rgba(0,0,0,.6);opacity:.92;
    user-select:none;-webkit-user-select:none;
  }
  .reorder-row-label{flex:1;font-weight:700;font-size:14px;color:var(--ink)}

  .card-add{
    border:2px dashed var(--border);border-radius:var(--radius);background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:var(--ink-faint);font-weight:700;font-size:13.5px;min-height:180px;transition:all .15s;
  }
  .card-add:hover{border-color:var(--orange);color:var(--orange)}
  .card-add .plus{font-size:30px;line-height:1;font-family:'Poppins',sans-serif;font-weight:400}

  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:14px}

  /* ── Modal ── */
  #modal-overlay,#reorder-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;
    align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;
  }
  #modal-overlay.show,#reorder-overlay.show{display:flex}
  .modal{
    background:var(--app-bg);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:420px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-head h2{font-size:18px;font-weight:700}
  .modal-close{font-size:20px;color:var(--ink-faint);padding:4px 8px}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);
    color:var(--ink);padding:10px 12px;font-size:14px;outline:none;font-family:inherit;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--orange)}
  .field textarea{resize:vertical;min-height:64px}
  .field label small{font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:0}

  /* ── Buscador de recomendados ── */
  .rec-picker{
    max-height:190px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-top:8px;background:var(--card);
  }
  .rec-group-label{
    padding:7px 12px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-faint);background:var(--app-bg);position:sticky;top:0;
  }
  .rec-row{
    display:flex;align-items:center;gap:9px;padding:8px 12px;font-size:13px;cursor:pointer;
    border-top:1px solid var(--border);
  }
  .rec-row input{width:16px;height:16px;accent-color:var(--orange);flex-shrink:0}
  .rec-empty{padding:14px;text-align:center;color:var(--ink-faint);font-size:12.5px}
  .field-row{display:flex;gap:10px;flex-wrap:wrap}
  .field-row .field{flex:1;min-width:120px}
  .photo-field{display:flex;align-items:center;gap:12px}
  .photo-preview{
    width:64px;height:64px;border-radius:var(--radius-sm);background:var(--card-2);
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);overflow:hidden;flex-shrink:0;font-size:11px;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover}
  .photo-actions{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
  .photo-actions label{color:var(--gold-dark);font-weight:700;cursor:pointer}
  .photo-actions button{color:var(--ink-faint);font-weight:600;text-align:left}
  .modal-error{background:#fbe6e0;color:#9a3a24;font-size:12.5px;padding:9px 12px;border-radius:var(--radius-sm)}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .btn-outline{padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--ink-soft);border:1px solid var(--border)}
  .btn-outline:hover{border-color:var(--ink-soft)}

  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--orange);color:#1a1006;padding:12px 20px;border-radius:999px;font-size:13.5px;
    font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.error{background:#c1523a;color:#fff}
</style>
</head>
<body>

  <div id="gate">
    <div class="logo-badge">🔥</div>
    <h1>Painel DeuFome</h1>
    <p>Entre com sua conta pra editar os itens e preços do cardápio digital.</p>
    <button class="btn-gold" id="btn-login">Entrar</button>
  </div>

  <div id="app">
    <header class="topbar">
      <div class="logo-badge">🔥</div>
      <div class="brand">Painel do Cardápio<small id="user-email"></small></div>
      <div class="topbar-actions">
        <a class="link-ghost" href="../index.html" target="_blank" rel="noopener">Ver cardápio</a>
        <button class="link-ghost" id="btn-reorder-cats">Reordenar categorias</button>
        <button class="link-ghost" id="btn-logout">Sair</button>
      </div>
    </header>

    <main>
      <div class="tabs" id="tabs"></div>
      <div class="statusbar">
        <div class="status" id="status"><span class="dot"></span><span id="status-text">Carregando…</span></div>
        <div class="statusbar-actions">
          <button class="btn-text" id="btn-discard" hidden>Descartar alterações</button>
          <button class="btn-primary" id="btn-save" disabled>Salvar alterações</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <div id="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">Novo item</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot">
        <button class="btn-outline" id="modal-cancel">Cancelar</button>
        <button class="btn-primary" id="modal-save">Salvar item</button>
      </div>
    </div>
  </div>

  <div id="reorder-overlay">
    <div class="modal">
      <div class="modal-head">
        <h2>Reordenar categorias</h2>
        <button class="modal-close" id="reorder-close">&times;</button>
      </div>
      <div class="modal-body">
        <p class="reorder-hint">Arraste pelo ⠿ pra mudar a ordem em que as categorias aparecem no cardápio.</p>
        <div class="reorder-list" id="reorder-list"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-outline" id="reorder-cancel">Cancelar</button>
        <button class="btn-primary" id="reorder-save" disabled>Salvar ordem</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function(){
  "use strict";

  const BRANCH = "main";
  // Git Gateway já sabe qual é o repositório (configurado na Netlify) — a URL
  // não leva /repos/dono/nome/, só /contents/<caminho>. Ver github.com/netlify/git-gateway/blob/master/api/github.go
  const API_BASE = `/.netlify/git/github/contents/`;

  // Nenhuma categoria da DeuFome tem variação de preço (P/G) hoje — todas usam
  // preço único (item.price). Se um dia precisar, é só adicionar "variants:[...]"
  // na categoria, igual ao padrão usado no cardápio de outros clientes.
  const CATEGORIES = [
    { key:"jantinhas", label:"Jantinhas", file:"site/data/jantinhas.json", singular:"jantinha" },
    { key:"espetinhos", label:"Espetinhos", file:"site/data/espetinhos.json", singular:"espetinho" },
    { key:"omeletes", label:"Omeletes", file:"site/data/omeletes.json", singular:"omelete" },
    { key:"macarrao", label:"Macarrão na Chapa", file:"site/data/macarrao.json", singular:"macarrão" },
    { key:"sobremesas", label:"Sobremesas", file:"site/data/sobremesas.json", singular:"sobremesa" },
    { key:"bebidas", label:"Bebidas", file:"site/data/bebidas.json", singular:"bebida" },
    { key:"adicionais", label:"Adicionais", file:"site/data/adicionais.json", singular:"adicional" },
  ];

  const TAG_LABELS = {
    "mais-vendido": "Mais vendido",
    "novidade": "Novidade",
    "picante": "Picante",
    "favorito": "Preferido da casa",
  };

  const CATEGORIAS_ORDER_FILE = "site/data/categorias.json";

  const state = {
    activeCat: CATEGORIES[0].key,
    data: {},        // key -> { items:[...], sha:'...', loaded:bool, dirty:bool }
    editing: null,   // { catKey, index|null, item:{...}, photoFile|null, removePhoto:bool }
    categoryOrder: CATEGORIES.map(c=>c.key), // ordem das abas/categorias — sobrescrita por categorias.json
    categoryOrderSha: null,
    categoryOrderDirty: false,
  };

  // ── Helpers ──
  function catByKey(key){ return CATEGORIES.find(c=>c.key===key); }

  function b64EncodeUnicode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
  }

  function toast(msg, isError){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = isError ? "show error" : "show";
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>{ el.className=""; }, 3200);
  }

  async function ghFetch(path, opts){
    opts = opts || {};
    const user = netlifyIdentity.currentUser();
    if(!user) throw new Error("Sessão expirada. Entra de novo.");
    const token = await user.jwt();
    const headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers||{});
    if(opts.body) headers["Content-Type"] = "application/json";
    return fetch(API_BASE + path, Object.assign({}, opts, { headers }));
  }

  async function getFile(path){
    const res = await ghFetch(path);
    if(!res.ok) throw new Error("Não consegui carregar " + path + " (" + res.status + ")");
    const json = await res.json();
    return { content: b64DecodeUnicode(json.content), sha: json.sha };
  }

  async function putFile(path, contentStr, sha, message){
    const body = { message, branch: BRANCH, content: b64EncodeUnicode(contentStr) };
    if(sha) body.sha = sha;
    const res = await ghFetch(path, { method:"PUT", body: JSON.stringify(body) });
    if(!res.ok){
      let detail = "";
      try{ detail = (await res.json()).message || ""; }catch(e){}
      throw new Error("Falha ao salvar (" + res.status + ") " + detail);
    }
    return res.json();
  }

  function slugify(str){
    return str.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "foto";
  }

  function readFileAsDataURL(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=>resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function uploadImage(file){
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const filename = Date.now() + "-" + slugify(file.name.replace(/\.[^.]+$/,"")) + "." + ext;
    const path = "site/imagens/uploads/" + filename;
    const dataUrl = await readFileAsDataURL(file);
    const base64 = dataUrl.split(",")[1];
    const res = await ghFetch(path, {
      method:"PUT",
      body: JSON.stringify({ message: "admin: upload " + filename, branch: BRANCH, content: base64 })
    });
    if(!res.ok) throw new Error("Falha ao enviar a foto (" + res.status + ")");
    return "/imagens/uploads/" + filename;
  }

  // ── Data loading ──
  async function loadCategory(key){
    const cat = catByKey(key);
    setStatus("saving", "Carregando " + cat.label + "…");
    try{
      const { content, sha } = await getFile(cat.file);
      const parsed = JSON.parse(content);
      state.data[key] = { items: parsed.items || [], sha, loaded:true, dirty:false };
      setStatus("ok", "Tudo salvo");
    }catch(err){
      setStatus("error", err.message);
      toast(err.message, true);
    }
    render();
  }

  function ensureLoaded(key){
    if(!state.data[key] || !state.data[key].loaded) return loadCategory(key);
    render();
    return Promise.resolve();
  }

  // Ordem das categorias/abas — vem de site/data/categorias.json, editável na tela de reordenar
  async function loadCategoryOrder(){
    try{
      const { content, sha } = await getFile(CATEGORIAS_ORDER_FILE);
      const parsed = JSON.parse(content);
      const validKeys = CATEGORIES.map(c=>c.key);
      const order = (Array.isArray(parsed.order) ? parsed.order : []).filter(k=>validKeys.includes(k));
      validKeys.forEach(k=>{ if(!order.includes(k)) order.push(k); });
      state.categoryOrder = order;
      state.categoryOrderSha = sha;
    }catch(err){
      console.error("Erro ao carregar " + CATEGORIAS_ORDER_FILE, err);
    }
    renderTabs();
  }

  // Carrega uma categoria sem mexer no status bar/render da aba ativa — usado pelo
  // buscador de "produtos recomendados", que precisa do catálogo inteiro em segundo plano.
  async function loadCategoryQuiet(key){
    if(state.data[key] && state.data[key].loaded) return;
    const cat = catByKey(key);
    try{
      const { content, sha } = await getFile(cat.file);
      const parsed = JSON.parse(content);
      state.data[key] = { items: parsed.items || [], sha, loaded:true, dirty:false };
    }catch(err){
      console.error("Erro ao carregar " + cat.file + " (recomendados)", err);
    }
  }

  function ensureAllCategoriesLoaded(){
    return Promise.all(CATEGORIES.map(c=>loadCategoryQuiet(c.key)));
  }

  function renderRecPicker(filter){
    const listEl = document.getElementById("f-rec-list");
    if(!listEl || !state.editing) return;
    const ed = state.editing;
    const q = (filter||"").trim().toLowerCase();
    let html = "";
    CATEGORIES.forEach(cat=>{
      const d = state.data[cat.key];
      if(!d || !d.loaded) return;
      const items = d.items.filter(it=>{
        if(cat.key===ed.catKey && it.name===ed.item.name) return false;
        if(!it.name) return false;
        return !q || it.name.toLowerCase().includes(q);
      });
      if(items.length===0) return;
      html += `<div class="rec-group-label">${escapeHtml(cat.label)}</div>`;
      items.forEach(it=>{
        const checked = ed.item.recommended.some(r=>r.category===cat.key && r.name===it.name) ? "checked" : "";
        html += `<label class="rec-row">
          <input type="checkbox" data-cat="${escapeAttr(cat.key)}" data-name="${escapeAttr(it.name)}" ${checked} />
          <span>${escapeHtml(it.name)}</span>
        </label>`;
      });
    });
    listEl.innerHTML = html || '<div class="rec-empty">Nenhum produto encontrado.</div>';
    listEl.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const category = cb.dataset.cat, name = cb.dataset.name;
        if(cb.checked){
          if(!ed.item.recommended.some(r=>r.category===category && r.name===name)){
            ed.item.recommended.push({category, name});
          }
        } else {
          ed.item.recommended = ed.item.recommended.filter(r=>!(r.category===category && r.name===name));
        }
      });
    });
  }

  // ── Status/UI ──
  function setStatus(kind, text){
    const el = document.getElementById("status");
    el.className = "status " + (kind==="dirty"?"dirty":kind==="saving"?"saving":kind==="error"?"error":"");
    document.getElementById("status-text").textContent = text;
  }

  function currentDirty(){
    const d = state.data[state.activeCat];
    return d && d.dirty;
  }

  function updateStatusBar(){
    const dirty = currentDirty();
    document.getElementById("btn-save").disabled = !dirty;
    document.getElementById("btn-discard").hidden = !dirty;
    if(dirty) setStatus("dirty", "Alterações não salvas");
    else if(state.data[state.activeCat] && state.data[state.activeCat].loaded) setStatus("ok","Tudo salvo");
  }

  function orderedCategories(){
    return state.categoryOrder.map(key=>catByKey(key)).filter(Boolean);
  }

  function renderTabs(){
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    orderedCategories().forEach(cat=>{
      const btn = document.createElement("button");
      btn.className = "tab" + (cat.key===state.activeCat ? " active" : "");
      const count = state.data[cat.key] ? state.data[cat.key].items.length : null;
      btn.innerHTML = cat.label + (count!==null ? ` <span class="count">(${count})</span>` : "");
      btn.addEventListener("click", ()=>{
        state.activeCat = cat.key;
        ensureLoaded(cat.key);
        renderTabs();
      });
      tabs.appendChild(btn);
    });
  }

  function render(){
    renderTabs();
    updateStatusBar();
    const grid = document.getElementById("grid");
    const cat = catByKey(state.activeCat);
    const d = state.data[state.activeCat];
    grid.innerHTML = "";
    if(!d || !d.loaded) return;

    d.items.forEach((item, idx)=>{
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.idx = idx;
      const priceStr = item.price!=null && item.price!=="" ? "R$" + Number(item.price).toFixed(2).replace(".",",") : "";
      const tagHTML = item.tag && TAG_LABELS[item.tag] ? `<div class="card-price">${TAG_LABELS[item.tag]}</div>` : "";
      card.innerHTML = `
        <div class="card-photo">${item.image ? `<img src="../${item.image.replace(/^\//,"")}" alt="">` : "sem foto"}</div>
        <div class="card-body">
          <h3>${escapeHtml(item.name||"(sem nome)")}</h3>
          <p>${escapeHtml(item.desc||"")}</p>
          <div class="card-price">${priceStr}</div>
          ${tagHTML}
        </div>
        <div class="card-actions">
          <button class="icon-btn drag-handle" title="Arrastar pra reordenar">⠿</button>
          <button class="icon-btn edit">Editar</button>
          <button class="icon-btn danger del">Excluir</button>
        </div>`;
      card.querySelector(".edit").addEventListener("click", ()=>openModal(state.activeCat, idx));
      card.querySelector(".del").addEventListener("click", ()=>deleteItem(state.activeCat, idx));
      card.querySelector(".drag-handle").addEventListener("pointerdown", (e)=>startDrag(e, state.activeCat, card));
      grid.appendChild(card);
    });

    const addCard = document.createElement("button");
    addCard.className = "card-add";
    addCard.innerHTML = `<span class="plus">+</span><span>Adicionar ${cat.singular}</span>`;
    addCard.addEventListener("click", ()=>openModal(state.activeCat, null));
    grid.appendChild(addCard);

    if(d.items.length===0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.style.gridColumn = "1/-1";
      empty.textContent = "Nada cadastrado ainda nessa categoria.";
      grid.insertBefore(empty, addCard);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ── Reordenar arrastando (ordem = posição no card = ordem de exibição no cardápio) ──
  let dragCtx = null;

  function startDrag(e, catKey, card){
    e.preventDefault();
    const handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);
    dragCtx = { catKey, card, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId };
    card.classList.add("dragging");
    handle.addEventListener("pointermove", onDragMove);
    handle.addEventListener("pointerup", onDragEnd);
    handle.addEventListener("pointercancel", onDragEnd);
  }

  function onDragMove(e){
    if(!dragCtx || e.pointerId!==dragCtx.pointerId) return;
    const { card } = dragCtx;
    const dx = e.clientX - dragCtx.startX;
    const dy = e.clientY - dragCtx.startY;
    card.style.transform = `translate(${dx}px, ${dy}px)`;
    card.style.pointerEvents = "none";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    card.style.pointerEvents = "";
    const targetCard = under && under.closest(".card");
    if(targetCard && targetCard!==card && targetCard.parentElement===card.parentElement){
      const grid = card.parentElement;
      const cards = Array.from(grid.querySelectorAll(".card"));
      const cardPos = cards.indexOf(card);
      const targetPos = cards.indexOf(targetCard);
      if(targetPos < cardPos) grid.insertBefore(card, targetCard);
      else grid.insertBefore(card, targetCard.nextSibling);
      // reancora o arrasto na nova posição pra não "pular" ao trocar de lugar
      dragCtx.startX = e.clientX;
      dragCtx.startY = e.clientY;
      card.style.transform = "translate(0px,0px)";
    }
  }

  function onDragEnd(e){
    if(!dragCtx || e.pointerId!==dragCtx.pointerId) return;
    const { catKey, card } = dragCtx;
    const handle = e.currentTarget;
    handle.removeEventListener("pointermove", onDragMove);
    handle.removeEventListener("pointerup", onDragEnd);
    handle.removeEventListener("pointercancel", onDragEnd);
    card.classList.remove("dragging");
    card.style.transform = "";
    const grid = card.parentElement;
    const d = state.data[catKey];
    const newOrder = Array.from(grid.querySelectorAll(".card"))
      .map(c => d.items[parseInt(c.dataset.idx, 10)]);
    if(newOrder.length===d.items.length){
      d.items = newOrder;
      d.dirty = true;
    }
    dragCtx = null;
    render();
  }

  function deleteItem(catKey, idx){
    const d = state.data[catKey];
    const item = d.items[idx];
    if(!confirm(`Excluir "${item.name}"? Isso só é gravado quando você clicar em "Salvar alterações".`)) return;
    d.items.splice(idx,1);
    d.dirty = true;
    render();
  }

  // ── Modal ──
  function openModal(catKey, idx){
    const cat = catByKey(catKey);
    const item = idx!=null ? JSON.parse(JSON.stringify(state.data[catKey].items[idx])) : { name:"", desc:"", image:"" };
    if(item.price==null) item.price = "";
    item.recommended = item.recommended || [];
    state.editing = { catKey, idx, item, photoFile:null, removePhoto:false };

    document.getElementById("modal-title").textContent = idx!=null ? "Editar " + cat.singular : "Novo " + cat.singular;
    const body = document.getElementById("modal-body");
    body.innerHTML = `
      <div class="modal-error" id="modal-error" hidden></div>
      <div class="field"><label>Nome</label><input type="text" id="f-name" value="${escapeAttr(item.name)}" /></div>
      <div class="field"><label>Descrição</label><textarea id="f-desc">${escapeHtml(item.desc||"")}</textarea></div>
      <div class="field"><label>Preço</label>
        <input type="number" step="0.01" min="0" class="f-price" value="${item.price}" />
      </div>
      <div class="field">
        <label>Destaque</label>
        <select id="f-tag">
          <option value="">Nenhum</option>
          ${Object.keys(TAG_LABELS).map(k=>`<option value="${k}" ${item.tag===k?"selected":""}>${TAG_LABELS[k]}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Foto</label>
        <div class="photo-field">
          <div class="photo-preview" id="photo-preview">${item.image ? `<img src="../${item.image.replace(/^\//,"")}" />` : "sem foto"}</div>
          <div class="photo-actions">
            <label>Trocar foto<input type="file" accept="image/*" id="f-photo" hidden /></label>
            ${item.image ? `<button id="f-remove-photo">Remover foto</button>` : ""}
          </div>
        </div>
      </div>
      <div class="field">
        <label>Produtos recomendados <small>(aparece como "Que tal também?" na tela do produto e no carrinho)</small></label>
        <input type="text" id="f-rec-search" placeholder="Buscar produto..." />
        <div class="rec-picker" id="f-rec-list">Carregando catálogo…</div>
      </div>`;

    document.getElementById("f-rec-search").addEventListener("input", (e)=>renderRecPicker(e.target.value));
    ensureAllCategoriesLoaded().then(()=>renderRecPicker(document.getElementById("f-rec-search").value));

    document.getElementById("f-photo").addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      state.editing.photoFile = file;
      state.editing.removePhoto = false;
      const dataUrl = await readFileAsDataURL(file);
      document.getElementById("photo-preview").innerHTML = `<img src="${dataUrl}" />`;
    });
    const rmBtn = document.getElementById("f-remove-photo");
    if(rmBtn) rmBtn.addEventListener("click", ()=>{
      state.editing.removePhoto = true;
      state.editing.photoFile = null;
      document.getElementById("photo-preview").innerHTML = "sem foto";
    });

    document.getElementById("modal-overlay").classList.add("show");
  }

  function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

  function closeModal(){
    document.getElementById("modal-overlay").classList.remove("show");
    state.editing = null;
  }

  async function saveModal(){
    const ed = state.editing;
    if(!ed) return;
    const cat = catByKey(ed.catKey);
    const name = document.getElementById("f-name").value.trim();
    const desc = document.getElementById("f-desc").value.trim();
    const errEl = document.getElementById("modal-error");
    errEl.hidden = true;

    if(!name){ errEl.hidden=false; errEl.textContent = "Nome é obrigatório."; return; }

    const priceEl = document.querySelector(".f-price");
    const priceVal = priceEl.value.trim();
    if(priceVal===""){ errEl.hidden=false; errEl.textContent = "Preencha o preço."; return; }
    const price = Number(priceVal);
    if(isNaN(price) || price < 0){ errEl.hidden=false; errEl.textContent = "Preço inválido."; return; }

    const saveBtn = document.getElementById("modal-save");
    saveBtn.disabled = true;
    saveBtn.textContent = "Enviando…";
    try{
      let image = ed.item.image || "";
      if(ed.removePhoto) image = "";
      if(ed.photoFile) image = await uploadImage(ed.photoFile);

      const newItem = { name, desc, price };
      if(image) newItem.image = image;
      const tag = document.getElementById("f-tag").value;
      if(tag) newItem.tag = tag;
      if(ed.item.recommended && ed.item.recommended.length) newItem.recommended = ed.item.recommended;

      const d = state.data[ed.catKey];
      if(ed.idx!=null) d.items[ed.idx] = newItem;
      else d.items.push(newItem);
      d.dirty = true;

      closeModal();
      render();
    }catch(err){
      errEl.hidden = false;
      errEl.textContent = err.message;
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = "Salvar item";
    }
  }

  // ── Save / discard category ──
  async function saveCategory(){
    const key = state.activeCat;
    const d = state.data[key];
    const cat = catByKey(key);
    if(!d || !d.dirty) return;
    setStatus("saving", "Salvando…");
    document.getElementById("btn-save").disabled = true;
    try{
      const content = JSON.stringify({ items: d.items }, null, 2) + "\n";
      const result = await putFile(cat.file, content, d.sha, "admin: atualiza " + cat.label);
      d.sha = result.content.sha;
      d.dirty = false;
      setStatus("ok", "Tudo salvo — o site atualiza em 1–2 minutos");
      toast("Alterações salvas! O cardápio publicado atualiza em 1–2 minutos.");
    }catch(err){
      if(String(err.message).includes("409")){
        toast("Alguém salvou essa categoria enquanto você editava. Recarregando os dados mais recentes…", true);
        await loadCategory(key);
      }else{
        setStatus("error", "Erro ao salvar");
        toast(err.message, true);
      }
    }
    render();
  }

  function discardCategory(){
    if(!confirm("Descartar as alterações não salvas dessa categoria?")) return;
    loadCategory(state.activeCat);
  }

  // ── Reordenar categorias (mesmo mecanismo de arrastar dos itens, numa lista à parte) ──
  function renderReorderList(){
    const list = document.getElementById("reorder-list");
    list.innerHTML = "";
    orderedCategories().forEach(cat=>{
      const row = document.createElement("div");
      row.className = "reorder-row";
      row.dataset.key = cat.key;
      row.innerHTML = `
        <button class="icon-btn drag-handle" title="Arrastar pra reordenar">⠿</button>
        <span class="reorder-row-label">${escapeHtml(cat.label)}</span>`;
      row.querySelector(".drag-handle").addEventListener("pointerdown", (e)=>startCatDrag(e, row));
      list.appendChild(row);
    });
  }

  let categoryOrderBeforeEdit = null;

  function openReorderModal(){
    categoryOrderBeforeEdit = state.categoryOrder.slice();
    renderReorderList();
    document.getElementById("reorder-save").disabled = true;
    document.getElementById("reorder-overlay").classList.add("show");
  }

  function closeReorderModal(){
    if(state.categoryOrderDirty && categoryOrderBeforeEdit){
      state.categoryOrder = categoryOrderBeforeEdit;
      state.categoryOrderDirty = false;
    }
    document.getElementById("reorder-overlay").classList.remove("show");
  }

  let catDragCtx = null;

  function startCatDrag(e, row){
    e.preventDefault();
    const handle = e.currentTarget;
    handle.setPointerCapture(e.pointerId);
    catDragCtx = { row, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId };
    row.classList.add("dragging");
    handle.addEventListener("pointermove", onCatDragMove);
    handle.addEventListener("pointerup", onCatDragEnd);
    handle.addEventListener("pointercancel", onCatDragEnd);
  }

  function onCatDragMove(e){
    if(!catDragCtx || e.pointerId!==catDragCtx.pointerId) return;
    const { row } = catDragCtx;
    const dx = e.clientX - catDragCtx.startX;
    const dy = e.clientY - catDragCtx.startY;
    row.style.transform = `translate(${dx}px, ${dy}px)`;
    row.style.pointerEvents = "none";
    const under = document.elementFromPoint(e.clientX, e.clientY);
    row.style.pointerEvents = "";
    const targetRow = under && under.closest(".reorder-row");
    if(targetRow && targetRow!==row && targetRow.parentElement===row.parentElement){
      const list = row.parentElement;
      const rows = Array.from(list.querySelectorAll(".reorder-row"));
      const rowPos = rows.indexOf(row);
      const targetPos = rows.indexOf(targetRow);
      if(targetPos < rowPos) list.insertBefore(row, targetRow);
      else list.insertBefore(row, targetRow.nextSibling);
      catDragCtx.startX = e.clientX;
      catDragCtx.startY = e.clientY;
      row.style.transform = "translate(0px,0px)";
    }
  }

  function onCatDragEnd(e){
    if(!catDragCtx || e.pointerId!==catDragCtx.pointerId) return;
    const { row } = catDragCtx;
    const handle = e.currentTarget;
    handle.removeEventListener("pointermove", onCatDragMove);
    handle.removeEventListener("pointerup", onCatDragEnd);
    handle.removeEventListener("pointercancel", onCatDragEnd);
    row.classList.remove("dragging");
    row.style.transform = "";
    const list = row.parentElement;
    const newOrder = Array.from(list.querySelectorAll(".reorder-row")).map(r=>r.dataset.key);
    state.categoryOrder = newOrder;
    state.categoryOrderDirty = true;
    document.getElementById("reorder-save").disabled = false;
    catDragCtx = null;
  }

  async function saveCategoryOrder(){
    if(!state.categoryOrderDirty) { closeReorderModal(); return; }
    const btn = document.getElementById("reorder-save");
    btn.disabled = true;
    btn.textContent = "Salvando…";
    try{
      const content = JSON.stringify({ order: state.categoryOrder }, null, 2) + "\n";
      const result = await putFile(CATEGORIAS_ORDER_FILE, content, state.categoryOrderSha, "admin: reordena categorias");
      state.categoryOrderSha = result.content.sha;
      state.categoryOrderDirty = false;
      closeReorderModal();
      renderTabs();
      toast("Ordem das categorias salva! O cardápio publicado atualiza em 1–2 minutos.");
    }catch(err){
      toast(err.message, true);
    }finally{
      btn.disabled = false;
      btn.textContent = "Salvar ordem";
    }
  }

  window.addEventListener("beforeunload", (e)=>{
    if(currentDirty()){ e.preventDefault(); e.returnValue=""; }
  });

  // ── Wiring ──
  document.getElementById("btn-save").addEventListener("click", saveCategory);
  document.getElementById("btn-discard").addEventListener("click", discardCategory);
  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-save").addEventListener("click", saveModal);
  document.getElementById("modal-overlay").addEventListener("click", (e)=>{
    if(e.target.id==="modal-overlay") closeModal();
  });

  document.getElementById("btn-reorder-cats").addEventListener("click", openReorderModal);
  document.getElementById("reorder-close").addEventListener("click", closeReorderModal);
  document.getElementById("reorder-cancel").addEventListener("click", closeReorderModal);
  document.getElementById("reorder-save").addEventListener("click", saveCategoryOrder);
  document.getElementById("reorder-overlay").addEventListener("click", (e)=>{
    if(e.target.id==="reorder-overlay") closeReorderModal();
  });

  // ── Auth ──
  function showApp(user){
    document.getElementById("gate").style.display = "none";
    const app = document.getElementById("app");
    app.classList.add("show");
    document.getElementById("user-email").textContent = user.email || "";
    ensureLoaded(state.activeCat);
    loadCategoryOrder();
  }
  function showGate(){
    document.getElementById("app").classList.remove("show");
    document.getElementById("gate").style.display = "flex";
  }

  document.getElementById("btn-login").addEventListener("click", ()=>netlifyIdentity.open("login"));
  document.getElementById("btn-logout").addEventListener("click", ()=>netlifyIdentity.logout());

  netlifyIdentity.on("init", user => { user ? showApp(user) : showGate(); });
  netlifyIdentity.on("login", user => { netlifyIdentity.close(); showApp(user); });
  netlifyIdentity.on("logout", () => showGate());

})();
</script>
</body>
</html>
